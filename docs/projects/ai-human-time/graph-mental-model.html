<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code-Path Graph — Mental Model</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
        .section {
            background: #0d1117;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #1a1a2e;
        }
        .section h2 {
            color: #00d9ff;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🕸️ Code-Path Graph Network</h1>
        <p class="subtitle">Visualizing control flow topology, growth, and health over time</p>
        
        <!-- MENTAL MODEL -->
        <div class="section">
            <h2>The Mental Model</h2>
            <svg width="100%" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="healthyEdge" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#4ade80"/>
                        <stop offset="100%" style="stop-color:#22c55e"/>
                    </linearGradient>
                    <linearGradient id="degradedEdge" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#f59e0b"/>
                        <stop offset="100%" style="stop-color:#d97706"/>
                    </linearGradient>
                    <linearGradient id="brokenEdge" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#ef4444"/>
                        <stop offset="100%" style="stop-color:#dc2626"/>
                    </linearGradient>
                    
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="2" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    
                    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
                    </marker>
                    <marker id="arrowYellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
                    </marker>
                    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
                    </marker>
                    
                    <!-- Animated flow particle -->
                    <circle id="flowParticle" r="4" fill="#4ade80">
                        <animate attributeName="opacity" values="1;0.3;1" dur="0.5s" repeatCount="indefinite"/>
                    </circle>
                </defs>
                
                <rect width="1000" height="500" fill="#0a0a0f"/>
                
                <!-- Title -->
                <text x="500" y="35" text-anchor="middle" fill="white" font-size="18" font-weight="bold">
                    GRAPH PRIMITIVES: Nodes, Edges, and Health States
                </text>
                
                <!-- ═══════════════════════════════════════════════════════ -->
                <!-- LEFT: Node Types -->
                <!-- ═══════════════════════════════════════════════════════ -->
                <g transform="translate(120, 100)">
                    <text x="0" y="0" fill="#00d9ff" font-size="14" font-weight="bold">NODES (Functions/Modules)</text>
                    
                    <!-- Entry point node -->
                    <circle cx="40" cy="50" r="25" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="3" filter="url(#glow)"/>
                    <text x="40" y="55" text-anchor="middle" fill="white" font-size="10" font-weight="bold">entry</text>
                    <text x="90" y="55" fill="#888" font-size="11">Entry Point</text>
                    
                    <!-- Regular function node -->
                    <circle cx="40" cy="110" r="20" fill="#1a1a2e" stroke="#00d9ff" stroke-width="2"/>
                    <text x="40" y="115" text-anchor="middle" fill="white" font-size="10">fn()</text>
                    <text x="90" y="115" fill="#888" font-size="11">Function</text>
                    
                    <!-- External service node -->
                    <rect x="18" y="150" width="44" height="30" rx="4" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
                    <text x="40" y="170" text-anchor="middle" fill="white" font-size="9">API</text>
                    <text x="90" y="170" fill="#888" font-size="11">External Service</text>
                    
                    <!-- Database node -->
                    <ellipse cx="40" cy="220" rx="22" ry="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <rect x="18" y="215" width="44" height="20" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <ellipse cx="40" cy="235" rx="22" ry="12" fill="none" stroke="#4ade80" stroke-width="2"/>
                    <text x="40" y="230" text-anchor="middle" fill="white" font-size="9">DB</text>
                    <text x="90" y="230" fill="#888" font-size="11">Data Store</text>
                </g>
                
                <!-- ═══════════════════════════════════════════════════════ -->
                <!-- CENTER: Edge States -->
                <!-- ═══════════════════════════════════════════════════════ -->
                <g transform="translate(380, 100)">
                    <text x="0" y="0" fill="#00d9ff" font-size="14" font-weight="bold">EDGES (Call Relationships)</text>
                    
                    <!-- Healthy edge -->
                    <line x1="0" y1="50" x2="100" y2="50" stroke="url(#healthyEdge)" stroke-width="3" marker-end="url(#arrowGreen)"/>
                    <circle cx="50" cy="50" r="4" fill="#4ade80">
                        <animate attributeName="cx" values="10;90;10" dur="1.5s" repeatCount="indefinite"/>
                    </circle>
                    <text x="130" y="55" fill="#4ade80" font-size="11" font-weight="bold">HEALTHY</text>
                    <text x="130" y="70" fill="#666" font-size="10">Fast, no errors</text>
                    
                    <!-- Degraded edge -->
                    <line x1="0" y1="110" x2="100" y2="110" stroke="url(#degradedEdge)" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arrowYellow)"/>
                    <circle cx="50" cy="110" r="4" fill="#f59e0b">
                        <animate attributeName="cx" values="10;90;10" dur="3s" repeatCount="indefinite"/>
                    </circle>
                    <text x="130" y="115" fill="#f59e0b" font-size="11" font-weight="bold">DEGRADED</text>
                    <text x="130" y="130" fill="#666" font-size="10">Slow, occasional errors</text>
                    
                    <!-- Broken edge -->
                    <line x1="0" y1="170" x2="45" y2="170" stroke="url(#brokenEdge)" stroke-width="3"/>
                    <line x1="55" y1="170" x2="100" y2="170" stroke="#ef4444" stroke-width="3" opacity="0.3"/>
                    <text x="50" y="175" text-anchor="middle" fill="#ef4444" font-size="16" font-weight="bold">✕</text>
                    <text x="130" y="175" fill="#ef4444" font-size="11" font-weight="bold">BROKEN</text>
                    <text x="130" y="190" fill="#666" font-size="10">Failed, blocked</text>
                    
                    <!-- New edge (growth) -->
                    <line x1="0" y1="230" x2="100" y2="230" stroke="#00d9ff" stroke-width="2" stroke-dasharray="4 4" opacity="0.5">
                        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1s" repeatCount="indefinite"/>
                    </line>
                    <text x="130" y="235" fill="#00d9ff" font-size="11" font-weight="bold">NEW</text>
                    <text x="130" y="250" fill="#666" font-size="10">Recently added path</text>
                </g>
                
                <!-- ═══════════════════════════════════════════════════════ -->
                <!-- RIGHT: Live Example Graph -->
                <!-- ═══════════════════════════════════════════════════════ -->
                <g transform="translate(680, 80)">
                    <text x="80" y="0" text-anchor="middle" fill="#00d9ff" font-size="14" font-weight="bold">LIVE TOPOLOGY</text>
                    
                    <!-- Entry node -->
                    <circle cx="80" cy="50" r="22" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="3" filter="url(#glow)"/>
                    <text x="80" y="55" text-anchor="middle" fill="white" font-size="9">main()</text>
                    
                    <!-- Healthy path: main → auth -->
                    <path d="M 60 65 Q 30 100 40 130" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
                    <circle r="3" fill="#4ade80">
                        <animateMotion dur="1s" repeatCount="indefinite">
                            <mpath href="#path1"/>
                        </animateMotion>
                    </circle>
                    
                    <circle cx="40" cy="150" r="18" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <text x="40" y="154" text-anchor="middle" fill="white" font-size="8">auth()</text>
                    
                    <!-- Healthy path: main → api -->
                    <path d="M 100 65 Q 130 100 120 130" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
                    
                    <circle cx="120" cy="150" r="18" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <text x="120" y="154" text-anchor="middle" fill="white" font-size="8">api()</text>
                    
                    <!-- Degraded path: api → external -->
                    <path d="M 138 150 Q 180 150 200 180" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowYellow)"/>
                    
                    <rect x="180" y="190" width="40" height="25" rx="4" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
                    <text x="200" y="207" text-anchor="middle" fill="white" font-size="8">3rd</text>
                    
                    <!-- Healthy path: auth → db -->
                    <path d="M 40 168 L 40 210" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
                    
                    <ellipse cx="40" cy="235" rx="18" ry="10" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <text x="40" y="239" text-anchor="middle" fill="white" font-size="8">DB</text>
                    
                    <!-- Broken path: api → cache -->
                    <path d="M 120 168 L 120 200" fill="none" stroke="#ef4444" stroke-width="2"/>
                    <text x="120" y="188" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">✕</text>
                    
                    <circle cx="120" cy="235" r="18" fill="#1a1a2e" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
                    <text x="120" y="239" text-anchor="middle" fill="#ef4444" font-size="8" opacity="0.7">cache</text>
                    
                    <!-- New path being added -->
                    <path d="M 200 215 Q 200 260 160 280" fill="none" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6">
                        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
                    </path>
                    
                    <circle cx="140" cy="290" r="16" fill="#1a1a2e" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6">
                        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
                    </circle>
                    <text x="140" y="294" text-anchor="middle" fill="#00d9ff" font-size="7" opacity="0.8">new()</text>
                </g>
                
                <!-- ═══════════════════════════════════════════════════════ -->
                <!-- BOTTOM: Key Metrics -->
                <!-- ═══════════════════════════════════════════════════════ -->
                <g transform="translate(50, 380)">
                    <rect width="900" height="90" rx="10" fill="#1a1a2e" stroke="#333"/>
                    
                    <text x="450" y="25" text-anchor="middle" fill="white" font-size="13" font-weight="bold">
                        KEY GRAPH METRICS
                    </text>
                    
                    <g transform="translate(50, 50)">
                        <circle r="8" fill="#4ade80"/>
                        <text x="20" y="5" fill="#ccc" font-size="11"><tspan font-weight="bold" fill="#4ade80">12</tspan> Healthy Edges</text>
                    </g>
                    
                    <g transform="translate(200, 50)">
                        <circle r="8" fill="#f59e0b"/>
                        <text x="20" y="5" fill="#ccc" font-size="11"><tspan font-weight="bold" fill="#f59e0b">3</tspan> Degraded Edges</text>
                    </g>
                    
                    <g transform="translate(350, 50)">
                        <circle r="8" fill="#ef4444"/>
                        <text x="20" y="5" fill="#ccc" font-size="11"><tspan font-weight="bold" fill="#ef4444">1</tspan> Broken Edge</text>
                    </g>
                    
                    <g transform="translate(500, 50)">
                        <circle r="8" fill="#00d9ff" opacity="0.6"/>
                        <text x="20" y="5" fill="#ccc" font-size="11"><tspan font-weight="bold" fill="#00d9ff">2</tspan> New Paths (24h)</text>
                    </g>
                    
                    <g transform="translate(680, 50)">
                        <text x="0" y="5" fill="#ccc" font-size="11">Graph Health: <tspan font-weight="bold" fill="#f59e0b">78%</tspan></text>
                    </g>
                </g>
            </svg>
        </div>
        
        <!-- GROWTH OVER TIME -->
        <div class="section">
            <h2>Graph Growth Over Time</h2>
            <svg width="100%" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
                <rect width="1000" height="300" fill="#0a0a0f"/>
                
                <!-- Timeline -->
                <line x1="50" y1="250" x2="950" y2="250" stroke="#333" stroke-width="2"/>
                
                <!-- T0: Initial -->
                <g transform="translate(100, 80)">
                    <text x="40" y="-20" text-anchor="middle" fill="#888" font-size="11">T₀: Initial</text>
                    <circle cx="40" cy="40" r="15" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
                    <circle cx="20" cy="90" r="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="60" cy="90" r="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <line x1="35" y1="55" x2="25" y2="78" stroke="#4ade80" stroke-width="2"/>
                    <line x1="45" y1="55" x2="55" y2="78" stroke="#4ade80" stroke-width="2"/>
                    <text x="40" y="140" text-anchor="middle" fill="#666" font-size="10">3 nodes, 2 edges</text>
                </g>
                
                <!-- T1: Growth -->
                <g transform="translate(300, 80)">
                    <text x="50" y="-20" text-anchor="middle" fill="#888" font-size="11">T₁: Growth</text>
                    <circle cx="50" cy="30" r="15" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
                    <circle cx="20" cy="75" r="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="80" cy="75" r="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="10" cy="120" r="10" fill="#1a1a2e" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="3 2"/>
                    <circle cx="50" cy="120" r="10" fill="#1a1a2e" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="3 2"/>
                    <circle cx="90" cy="120" r="10" fill="#1a1a2e" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="3 2"/>
                    <line x1="40" y1="45" x2="25" y2="63" stroke="#4ade80" stroke-width="2"/>
                    <line x1="60" y1="45" x2="75" y2="63" stroke="#4ade80" stroke-width="2"/>
                    <line x1="15" y1="87" x2="12" y2="110" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="3 2"/>
                    <line x1="25" y1="87" x2="45" y2="110" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="3 2"/>
                    <line x1="85" y1="87" x2="88" y2="110" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="3 2"/>
                    <text x="50" y="150" text-anchor="middle" fill="#00d9ff" font-size="10">+3 nodes, +3 edges</text>
                </g>
                
                <!-- T2: Issue -->
                <g transform="translate(530, 80)">
                    <text x="50" y="-20" text-anchor="middle" fill="#888" font-size="11">T₂: Issue Detected</text>
                    <circle cx="50" cy="30" r="15" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
                    <circle cx="20" cy="75" r="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="80" cy="75" r="12" fill="#1a1a2e" stroke="#ef4444" stroke-width="2"/>
                    <circle cx="10" cy="120" r="10" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="50" cy="120" r="10" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="90" cy="120" r="10" fill="#1a1a2e" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
                    <line x1="40" y1="45" x2="25" y2="63" stroke="#4ade80" stroke-width="2"/>
                    <line x1="60" y1="45" x2="75" y2="63" stroke="#ef4444" stroke-width="2"/>
                    <text x="68" y="58" fill="#ef4444" font-size="10" font-weight="bold">✕</text>
                    <line x1="15" y1="87" x2="12" y2="110" stroke="#4ade80" stroke-width="2"/>
                    <line x1="25" y1="87" x2="45" y2="110" stroke="#4ade80" stroke-width="2"/>
                    <line x1="85" y1="87" x2="88" y2="110" stroke="#ef4444" stroke-width="2" opacity="0.3"/>
                    <text x="50" y="150" text-anchor="middle" fill="#ef4444" font-size="10">🚨 Broken path detected</text>
                </g>
                
                <!-- T3: Resolved -->
                <g transform="translate(760, 80)">
                    <text x="60" y="-20" text-anchor="middle" fill="#888" font-size="11">T₃: Resolved + Growth</text>
                    <circle cx="60" cy="30" r="15" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
                    <circle cx="25" cy="75" r="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="95" cy="75" r="12" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="10" cy="120" r="10" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="50" cy="120" r="10" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="90" cy="120" r="10" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
                    <circle cx="130" cy="120" r="10" fill="#1a1a2e" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="3 2"/>
                    <line x1="50" y1="45" x2="30" y2="63" stroke="#4ade80" stroke-width="2"/>
                    <line x1="70" y1="45" x2="90" y2="63" stroke="#4ade80" stroke-width="2"/>
                    <line x1="20" y1="87" x2="12" y2="110" stroke="#4ade80" stroke-width="2"/>
                    <line x1="30" y1="87" x2="48" y2="110" stroke="#4ade80" stroke-width="2"/>
                    <line x1="100" y1="87" x2="92" y2="110" stroke="#4ade80" stroke-width="2"/>
                    <line x1="105" y1="87" x2="125" y2="110" stroke="#00d9ff" stroke-width="1.5" stroke-dasharray="3 2"/>
                    <text x="60" y="150" text-anchor="middle" fill="#4ade80" font-size="10">✓ All paths healthy</text>
                </g>
                
                <!-- Time markers -->
                <text x="140" y="270" text-anchor="middle" fill="#666" font-size="10">Day 1</text>
                <text x="350" y="270" text-anchor="middle" fill="#666" font-size="10">Day 3</text>
                <text x="580" y="270" text-anchor="middle" fill="#666" font-size="10">Day 5</text>
                <text x="820" y="270" text-anchor="middle" fill="#666" font-size="10">Day 7</text>
            </svg>
        </div>
    </div>
</body>
</html>
