<svg viewBox="0 0 1100 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="750" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="url(#headerGrad)" font-size="26" font-weight="bold">Kenney Mini-Characters - Asset Analysis</text>
  <text x="550" y="65" text-anchor="middle" fill="#8b949e" font-size="13">12 Character Variants • 32 Animations • Fully Rigged</text>
  
  <!-- Model Info Box -->
  <g transform="translate(30, 90)">
    <rect x="0" y="0" width="320" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="160" y="28" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">📦 MODEL STRUCTURE</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="0" fill="#8b949e" font-size="11">Format:</text>
      <text x="100" y="0" fill="#e6edf3" font-size="11">GLB (Binary GLTF 2.0)</text>
      
      <text x="0" y="22" fill="#8b949e" font-size="11">Generator:</text>
      <text x="100" y="22" fill="#e6edf3" font-size="11">UnityGLTF</text>
      
      <text x="0" y="44" fill="#8b949e" font-size="11">File Size:</text>
      <text x="100" y="44" fill="#e6edf3" font-size="11">~245 KB each</text>
      
      <text x="0" y="66" fill="#8b949e" font-size="11">Meshes:</text>
      <text x="100" y="66" fill="#e6edf3" font-size="11">2 (body + head)</text>
      
      <text x="0" y="88" fill="#8b949e" font-size="11">Rigging:</text>
      <text x="100" y="88" fill="#22c55e" font-size="11">✓ Skinned (armature)</text>
      
      <text x="0" y="110" fill="#8b949e" font-size="11">Texture:</text>
      <text x="100" y="110" fill="#f59e0b" font-size="11">colormap.png (external)</text>
      
      <text x="0" y="132" fill="#8b949e" font-size="11">Animations:</text>
      <text x="100" y="132" fill="#22c55e" font-size="11" font-weight="bold">32 clips embedded!</text>
    </g>
  </g>
  
  <!-- Skeleton Hierarchy -->
  <g transform="translate(370, 90)">
    <rect x="0" y="0" width="320" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="160" y="28" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold">🦴 SKELETON HIERARCHY</text>
    
    <g transform="translate(60, 55)">
      <!-- Root -->
      <rect x="60" y="0" width="80" height="24" rx="4" fill="#6366f1"/>
      <text x="100" y="16" text-anchor="middle" fill="white" font-size="10">root</text>
      
      <!-- Lines down -->
      <line x1="100" y1="24" x2="100" y2="35" stroke="#6366f1" stroke-width="2"/>
      <line x1="30" y1="35" x2="170" y2="35" stroke="#6366f1" stroke-width="2"/>
      
      <!-- Legs -->
      <line x1="30" y1="35" x2="30" y2="45" stroke="#6366f1" stroke-width="2"/>
      <rect x="0" y="45" width="60" height="20" rx="3" fill="#3b82f6"/>
      <text x="30" y="59" text-anchor="middle" fill="white" font-size="9">leg-left</text>
      
      <line x1="170" y1="35" x2="170" y2="45" stroke="#6366f1" stroke-width="2"/>
      <rect x="140" y="45" width="60" height="20" rx="3" fill="#3b82f6"/>
      <text x="170" y="59" text-anchor="middle" fill="white" font-size="9">leg-right</text>
      
      <!-- Torso -->
      <line x1="100" y1="35" x2="100" y2="75" stroke="#6366f1" stroke-width="2"/>
      <rect x="60" y="75" width="80" height="24" rx="4" fill="#22c55e"/>
      <text x="100" y="91" text-anchor="middle" fill="white" font-size="10">torso</text>
      
      <!-- Arms & Head from torso -->
      <line x1="100" y1="99" x2="100" y2="105" stroke="#22c55e" stroke-width="2"/>
      <line x1="30" y1="105" x2="170" y2="105" stroke="#22c55e" stroke-width="2"/>
      
      <rect x="0" y="110" width="55" height="18" rx="3" fill="#f59e0b"/>
      <text x="27" y="122" text-anchor="middle" fill="black" font-size="8">arm-left</text>
      
      <rect x="70" y="110" width="60" height="18" rx="3" fill="#ec4899"/>
      <text x="100" y="122" text-anchor="middle" fill="white" font-size="8">head</text>
      
      <rect x="145" y="110" width="55" height="18" rx="3" fill="#f59e0b"/>
      <text x="172" y="122" text-anchor="middle" fill="black" font-size="8">arm-right</text>
    </g>
  </g>
  
  <!-- Character Variants -->
  <g transform="translate(710, 90)">
    <rect x="0" y="0" width="360" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="180" y="28" text-anchor="middle" fill="#06b6d4" font-size="14" font-weight="bold">👥 12 CHARACTER VARIANTS</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="0" fill="#60a5fa" font-size="12" font-weight="bold">Male (6 variants)</text>
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="45" height="25" rx="4" fill="#1e40af"/>
        <text x="22" y="17" text-anchor="middle" fill="white" font-size="10">A</text>
        <rect x="52" y="0" width="45" height="25" rx="4" fill="#166534"/>
        <text x="74" y="17" text-anchor="middle" fill="white" font-size="10">B</text>
        <rect x="104" y="0" width="45" height="25" rx="4" fill="#9a3412"/>
        <text x="126" y="17" text-anchor="middle" fill="white" font-size="10">C</text>
        <rect x="156" y="0" width="45" height="25" rx="4" fill="#581c87"/>
        <text x="178" y="17" text-anchor="middle" fill="white" font-size="10">D</text>
        <rect x="208" y="0" width="45" height="25" rx="4" fill="#991b1b"/>
        <text x="230" y="17" text-anchor="middle" fill="white" font-size="10">E</text>
        <rect x="260" y="0" width="45" height="25" rx="4" fill="#155e75"/>
        <text x="282" y="17" text-anchor="middle" fill="white" font-size="10">F</text>
      </g>
      
      <text x="0" y="65" fill="#f472b6" font-size="12" font-weight="bold">Female (6 variants)</text>
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="45" height="25" rx="4" fill="#9d174d"/>
        <text x="22" y="17" text-anchor="middle" fill="white" font-size="10">A</text>
        <rect x="52" y="0" width="45" height="25" rx="4" fill="#6b21a8"/>
        <text x="74" y="17" text-anchor="middle" fill="white" font-size="10">B</text>
        <rect x="104" y="0" width="45" height="25" rx="4" fill="#115e59"/>
        <text x="126" y="17" text-anchor="middle" fill="white" font-size="10">C</text>
        <rect x="156" y="0" width="45" height="25" rx="4" fill="#c2410c"/>
        <text x="178" y="17" text-anchor="middle" fill="white" font-size="10">D</text>
        <rect x="208" y="0" width="45" height="25" rx="4" fill="#3f6212"/>
        <text x="230" y="17" text-anchor="middle" fill="white" font-size="10">E</text>
        <rect x="260" y="0" width="45" height="25" rx="4" fill="#0369a1"/>
        <text x="282" y="17" text-anchor="middle" fill="white" font-size="10">F</text>
      </g>
    </g>
    
    <text x="180" y="185" text-anchor="middle" fill="#6b7280" font-size="10">Each variant has unique outfit colors via texture atlas</text>
  </g>
  
  <!-- ANIMATIONS - Main Section -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="1040" height="420" rx="10" fill="#161b22" stroke="#22c55e" stroke-width="2"/>
    <text x="520" y="30" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="bold">🎬 32 EMBEDDED ANIMATIONS</text>
    
    <!-- Basic Movement -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="230" height="160" rx="8" fill="#0e4429" stroke="#22c55e" stroke-width="1"/>
      <text x="115" y="22" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="bold">BASIC MOVEMENT</text>
      
      <g transform="translate(15, 40)" font-size="11" fill="#c9d1d9">
        <text x="0" y="0">0. static</text>
        <text x="0" y="18">1. idle</text>
        <text x="0" y="36">2. walk</text>
        <text x="0" y="54">3. sprint</text>
        <text x="0" y="72">4. jump</text>
        <text x="0" y="90">5. fall</text>
        <text x="0" y="108">6. crouch</text>
        
        <text x="100" y="0" fill="#22c55e">← Perfect for</text>
        <text x="100" y="15" fill="#22c55e">   agent states!</text>
      </g>
    </g>
    
    <!-- Interactions -->
    <g transform="translate(275, 55)">
      <rect x="0" y="0" width="230" height="160" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
      <text x="115" y="22" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">INTERACTIONS</text>
      
      <g transform="translate(15, 40)" font-size="11" fill="#c9d1d9">
        <text x="0" y="0">7. sit</text>
        <text x="0" y="18">8. drive</text>
        <text x="0" y="36">9. die</text>
        <text x="0" y="54">10. pick-up</text>
        <text x="0" y="72">23. interact-right</text>
        <text x="0" y="90">24. interact-left</text>
        
        <text x="130" y="18" fill="#3b82f6">← "sit" for</text>
        <text x="130" y="33" fill="#3b82f6">   desk work!</text>
      </g>
    </g>
    
    <!-- Emotes -->
    <g transform="translate(525, 55)">
      <rect x="0" y="0" width="230" height="160" rx="8" fill="#3d1c3d" stroke="#ec4899" stroke-width="1"/>
      <text x="115" y="22" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="bold">EMOTES</text>
      
      <g transform="translate(15, 40)" font-size="11" fill="#c9d1d9">
        <text x="0" y="0">11. emote-yes</text>
        <text x="0" y="18">12. emote-no</text>
        
        <text x="130" y="0" fill="#ec4899">← Task</text>
        <text x="130" y="15" fill="#ec4899">   complete!</text>
        <text x="130" y="45" fill="#ec4899">← Blocked /</text>
        <text x="130" y="60" fill="#ec4899">   error!</text>
      </g>
    </g>
    
    <!-- Holding Items -->
    <g transform="translate(775, 55)">
      <rect x="0" y="0" width="240" height="160" rx="8" fill="#3d2a14" stroke="#f59e0b" stroke-width="1"/>
      <text x="120" y="22" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">HOLDING ITEMS</text>
      
      <g transform="translate(15, 40)" font-size="11" fill="#c9d1d9">
        <text x="0" y="0">13. holding-right</text>
        <text x="0" y="18">14. holding-left</text>
        <text x="0" y="36">15. holding-both</text>
        <text x="0" y="54">16. holding-right-shoot</text>
        <text x="0" y="72">17. holding-left-shoot</text>
        <text x="0" y="90">18. holding-both-shoot</text>
      </g>
    </g>
    
    <!-- Combat -->
    <g transform="translate(25, 230)">
      <rect x="0" y="0" width="230" height="140" rx="8" fill="#3d1414" stroke="#ef4444" stroke-width="1"/>
      <text x="115" y="22" text-anchor="middle" fill="#f87171" font-size="12" font-weight="bold">COMBAT</text>
      
      <g transform="translate(15, 40)" font-size="11" fill="#c9d1d9">
        <text x="0" y="0">19. attack-melee-right</text>
        <text x="0" y="18">20. attack-melee-left</text>
        <text x="0" y="36">21. attack-kick-right</text>
        <text x="0" y="54">22. attack-kick-left</text>
      </g>
    </g>
    
    <!-- Wheelchair (Accessibility!) -->
    <g transform="translate(275, 230)">
      <rect x="0" y="0" width="320" height="140" rx="8" fill="#1a1a3a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="160" y="22" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">♿ WHEELCHAIR ANIMATIONS</text>
      
      <g transform="translate(15, 40)" font-size="11" fill="#c9d1d9">
        <text x="0" y="0">25. wheelchair-sit</text>
        <text x="0" y="18">26. wheelchair-look-left</text>
        <text x="0" y="36">27. wheelchair-look-right</text>
        <text x="160" y="0">28. wheelchair-move-forward</text>
        <text x="160" y="18">29. wheelchair-move-back</text>
        <text x="160" y="36">30. wheelchair-move-left</text>
        <text x="160" y="54">31. wheelchair-move-right</text>
      </g>
      
      <text x="160" y="125" text-anchor="middle" fill="#6b7280" font-size="9">Great for accessibility representation!</text>
    </g>
    
    <!-- Agent Mapping -->
    <g transform="translate(620, 230)">
      <rect x="0" y="0" width="395" height="140" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
      <text x="197" y="22" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">🎯 RECOMMENDED FOR AGENTS</text>
      
      <g transform="translate(15, 42)" font-size="11">
        <text x="0" y="0" fill="#8b949e">Working at desk:</text>
        <text x="110" y="0" fill="#22c55e" font-weight="bold">sit + idle blend</text>
        
        <text x="0" y="20" fill="#8b949e">Task complete:</text>
        <text x="110" y="20" fill="#3b82f6" font-weight="bold">emote-yes</text>
        
        <text x="0" y="40" fill="#8b949e">Blocked/Error:</text>
        <text x="110" y="40" fill="#ef4444" font-weight="bold">emote-no</text>
        
        <text x="0" y="60" fill="#8b949e">Idle waiting:</text>
        <text x="110" y="60" fill="#f59e0b" font-weight="bold">idle</text>
        
        <text x="200" y="0" fill="#8b949e">Communicating:</text>
        <text x="310" y="0" fill="#a855f7" font-weight="bold">interact-*</text>
        
        <text x="200" y="20" fill="#8b949e">Moving:</text>
        <text x="310" y="20" fill="#06b6d4" font-weight="bold">walk</text>
        
        <text x="200" y="40" fill="#8b949e">Urgent:</text>
        <text x="310" y="40" fill="#ec4899" font-weight="bold">sprint</text>
        
        <text x="200" y="60" fill="#8b949e">Picking up task:</text>
        <text x="310" y="60" fill="#22c55e" font-weight="bold">pick-up</text>
      </g>
    </g>
  </g>
  
  <!-- Missing Texture Note -->
  <g transform="translate(30, 715)">
    <rect x="0" y="0" width="1040" height="28" rx="6" fill="#7c2d12" stroke="#ea580c" stroke-width="1"/>
    <text x="520" y="18" text-anchor="middle" fill="#fed7aa" font-size="11">
      ⚠️ Missing: Textures/colormap.png - Upload this file for proper character textures. Models will work with fallback colors without it.
    </text>
  </g>
</svg>
