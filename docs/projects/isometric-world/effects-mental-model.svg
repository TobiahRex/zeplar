<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated flow gradient -->
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="30%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#22d3ee"/>
      <stop offset="70%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    
    <!-- Burst gradient -->
    <radialGradient id="burstGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0"/>
    </radialGradient>
    
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold">Energy Flow &amp; Burst Effects - Mental Model</text>
  
  <!-- ========== SECTION 1: ENERGY FLOW PATHS ========== -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="380" height="280" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="bold">ENERGY FLOW PATHS</text>
    
    <!-- Concept illustration -->
    <g transform="translate(40, 60)">
      <!-- Block A -->
      <rect x="0" y="40" width="50" height="50" rx="6" fill="#2a9d8f"/>
      <text x="25" y="70" text-anchor="middle" fill="white" font-size="11" font-weight="bold">A</text>
      
      <!-- Block B -->
      <rect x="250" y="40" width="50" height="50" rx="6" fill="#e63946"/>
      <text x="275" y="70" text-anchor="middle" fill="white" font-size="11" font-weight="bold">B</text>
      
      <!-- Flow path -->
      <path d="M 55 65 Q 150 20, 245 65" stroke="url(#flowGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
      
      <!-- Flow particles (static representation) -->
      <circle cx="100" cy="45" r="4" fill="#22d3ee"/>
      <circle cx="150" cy="30" r="5" fill="#06b6d4"/>
      <circle cx="200" cy="40" r="4" fill="#22d3ee"/>
      
      <!-- Direction arrow -->
      <text x="150" y="10" text-anchor="middle" fill="#8b949e" font-size="10">direction of flow →</text>
    </g>
    
    <!-- Technical breakdown -->
    <g transform="translate(20, 160)">
      <text x="0" y="0" fill="#3fb950" font-size="12" font-weight="bold">STRUCTURE:</text>
      <text x="0" y="20" fill="#c9d1d9" font-size="11">• TubeGeometry along curved path</text>
      <text x="0" y="38" fill="#c9d1d9" font-size="11">• CatmullRomCurve3 for smooth curves</text>
      
      <text x="0" y="65" fill="#f0883e" font-size="12" font-weight="bold">BEHAVIOR:</text>
      <text x="0" y="85" fill="#c9d1d9" font-size="11">• UV offset animated over time</text>
      <text x="0" y="103" fill="#c9d1d9" font-size="11">• offset += speed * deltaTime</text>
    </g>
  </g>
  
  <!-- ========== SECTION 2: BURST EFFECT ========== -->
  <g transform="translate(470, 80)">
    <rect x="0" y="0" width="380" height="280" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="190" y="30" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="bold">ATMOSPHERIC BURST</text>
    
    <!-- Burst illustration -->
    <g transform="translate(190, 130)">
      <!-- Expanding rings -->
      <circle cx="0" cy="0" r="80" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
      <circle cx="0" cy="0" r="20" fill="url(#burstGradient)" opacity="0.8"/>
      
      <!-- Center block -->
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#ffd700" stroke="#fff" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" fill="#000" font-size="10" font-weight="bold">!</text>
    </g>
    
    <!-- Timeline -->
    <g transform="translate(20, 200)">
      <text x="0" y="0" fill="#8b949e" font-size="10">TIME →</text>
      <line x1="0" y1="15" x2="340" y2="15" stroke="#30363d" stroke-width="2"/>
      
      <!-- T0 -->
      <circle cx="30" cy="15" r="6" fill="#fbbf24"/>
      <text x="30" y="35" text-anchor="middle" fill="#c9d1d9" font-size="9">click</text>
      <text x="30" y="47" text-anchor="middle" fill="#8b949e" font-size="8">r=0</text>
      
      <!-- T1 -->
      <circle cx="120" cy="15" r="6" fill="#f59e0b" opacity="0.8"/>
      <text x="120" y="35" text-anchor="middle" fill="#c9d1d9" font-size="9">expand</text>
      <text x="120" y="47" text-anchor="middle" fill="#8b949e" font-size="8">r=50%</text>
      
      <!-- T2 -->
      <circle cx="210" cy="15" r="6" fill="#f59e0b" opacity="0.5"/>
      <text x="210" y="35" text-anchor="middle" fill="#c9d1d9" font-size="9">fade</text>
      <text x="210" y="47" text-anchor="middle" fill="#8b949e" font-size="8">r=80%</text>
      
      <!-- T3 -->
      <circle cx="300" cy="15" r="6" fill="#f59e0b" opacity="0.2"/>
      <text x="300" y="35" text-anchor="middle" fill="#c9d1d9" font-size="9">gone</text>
      <text x="300" y="47" text-anchor="middle" fill="#8b949e" font-size="8">r=100%</text>
    </g>
  </g>
  
  <!-- ========== SECTION 3: DATA FLOW DIAGRAM ========== -->
  <g transform="translate(50, 390)">
    <rect x="0" y="0" width="800" height="130" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold">DATA FLOW: How Effects Update Each Frame</text>
    
    <!-- Flow diagram -->
    <g transform="translate(30, 50)">
      <!-- RAF -->
      <rect x="0" y="0" width="100" height="50" rx="6" fill="#238636"/>
      <text x="50" y="20" text-anchor="middle" fill="white" font-size="10" font-weight="bold">requestAnim</text>
      <text x="50" y="35" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Frame</text>
      
      <line x1="105" y1="25" x2="140" y2="25" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Delta time -->
      <rect x="145" y="0" width="90" height="50" rx="6" fill="#1f6feb"/>
      <text x="190" y="20" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Δt = now -</text>
      <text x="190" y="35" text-anchor="middle" fill="white" font-size="10" font-weight="bold">lastFrame</text>
      
      <line x1="240" y1="25" x2="275" y2="25" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Update paths -->
      <rect x="280" y="0" width="110" height="50" rx="6" fill="#8957e5"/>
      <text x="335" y="20" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Update Paths</text>
      <text x="335" y="35" text-anchor="middle" fill="white" font-size="10">offset += Δt</text>
      
      <line x1="395" y1="25" x2="430" y2="25" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Update bursts -->
      <rect x="435" y="0" width="110" height="50" rx="6" fill="#da3633"/>
      <text x="490" y="20" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Update Bursts</text>
      <text x="490" y="35" text-anchor="middle" fill="white" font-size="10">scale, opacity</text>
      
      <line x1="550" y1="25" x2="585" y2="25" stroke="#f85149" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Render -->
      <rect x="590" y="0" width="90" height="50" rx="6" fill="#f0883e"/>
      <text x="635" y="20" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Render</text>
      <text x="635" y="35" text-anchor="middle" fill="white" font-size="10">Scene</text>
      
      <!-- Loop back arrow -->
      <path d="M 680 25 Q 720 25, 720 80 Q 720 100, 400 100 Q 50 100, 50 60" 
            stroke="#3fb950" stroke-width="1" fill="none" stroke-dasharray="4" marker-end="url(#arrow)"/>
      <text x="400" y="115" text-anchor="middle" fill="#3fb950" font-size="9">~60 FPS loop</text>
    </g>
  </g>
  
  <!-- ========== SECTION 4: KEY FORMULAS ========== -->
  <g transform="translate(50, 540)">
    <rect x="0" y="0" width="380" height="140" rx="12" fill="#1c2128" stroke="#58a6ff" stroke-width="2"/>
    <text x="190" y="25" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">ENERGY PATH FORMULAS</text>
    
    <text x="20" y="55" fill="#c9d1d9" font-size="12" font-family="monospace">// UV offset for flow direction</text>
    <text x="20" y="75" fill="#7ee787" font-size="12" font-family="monospace">material.map.offset.x += speed * Δt</text>
    
    <text x="20" y="100" fill="#c9d1d9" font-size="12" font-family="monospace">// Pulse brightness</text>
    <text x="20" y="120" fill="#7ee787" font-size="12" font-family="monospace">emissive = sin(time * freq) * 0.5 + 0.5</text>
  </g>
  
  <g transform="translate(470, 540)">
    <rect x="0" y="0" width="380" height="140" rx="12" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
    <text x="190" y="25" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">BURST EFFECT FORMULAS</text>
    
    <text x="20" y="55" fill="#c9d1d9" font-size="12" font-family="monospace">// Expansion (easeOut)</text>
    <text x="20" y="75" fill="#7ee787" font-size="12" font-family="monospace">scale = maxR * (1 - (1-t)²)</text>
    
    <text x="20" y="100" fill="#c9d1d9" font-size="12" font-family="monospace">// Fade out</text>
    <text x="20" y="120" fill="#7ee787" font-size="12" font-family="monospace">opacity = 1 - t</text>
  </g>
</svg>
