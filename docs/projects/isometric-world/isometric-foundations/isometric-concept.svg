<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#51cf66"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#339af0"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold">Isometric Projection: 3D → 2D Transformation</text>
  
  <!-- Left side: 3D Cartesian -->
  <g transform="translate(150, 280)">
    <text x="0" y="-180" text-anchor="middle" fill="#aaa" font-size="16">3D WORLD SPACE</text>
    
    <!-- X axis (red) -->
    <line x1="0" y1="0" x2="100" y2="50" stroke="#ff6b6b" stroke-width="3" marker-end="url(#arrowhead-red)"/>
    <text x="110" y="60" fill="#ff6b6b" font-size="14" font-weight="bold">X</text>
    
    <!-- Y axis (green) -->
    <line x1="0" y1="0" x2="-100" y2="50" stroke="#51cf66" stroke-width="3" marker-end="url(#arrowhead-green)"/>
    <text x="-120" y="60" fill="#51cf66" font-size="14" font-weight="bold">Y</text>
    
    <!-- Z axis (blue) - going up -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#339af0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
    <text x="10" y="-125" fill="#339af0" font-size="14" font-weight="bold">Z (height)</text>
    
    <!-- Grid on floor -->
    <g stroke="#444" stroke-width="1" opacity="0.5">
      <line x1="-80" y1="40" x2="80" y2="40"/>
      <line x1="-60" y1="30" x2="60" y2="30"/>
      <line x1="-40" y1="20" x2="40" y2="20"/>
    </g>
    
    <!-- Sample point -->
    <circle cx="40" cy="-40" r="8" fill="#ffd43b"/>
    <text x="55" y="-35" fill="#ffd43b" font-size="12">Point(2,1,3)</text>
    
    <!-- Dotted line to floor -->
    <line x1="40" y1="-40" x2="40" y2="20" stroke="#ffd43b" stroke-width="1" stroke-dasharray="4"/>
  </g>
  
  <!-- Arrow between -->
  <g transform="translate(350, 250)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="white" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="40" y="-15" text-anchor="middle" fill="white" font-size="12">PROJECT</text>
  </g>
  
  <!-- Right side: 2D Screen -->
  <g transform="translate(550, 280)">
    <text x="50" y="-180" text-anchor="middle" fill="#aaa" font-size="16">2D SCREEN SPACE</text>
    
    <!-- Screen rectangle -->
    <rect x="-50" y="-150" width="200" height="200" fill="#2a2a4a" stroke="#666" stroke-width="2" rx="5"/>
    
    <!-- Screen X axis -->
    <line x1="-30" y1="30" x2="130" y2="30" stroke="#888" stroke-width="1" stroke-dasharray="4"/>
    <text x="140" y="35" fill="#888" font-size="12">screenX</text>
    
    <!-- Screen Y axis -->
    <line x1="50" y1="-130" x2="50" y2="40" stroke="#888" stroke-width="1" stroke-dasharray="4"/>
    <text x="55" y="-135" fill="#888" font-size="12">screenY</text>
    
    <!-- Projected point -->
    <circle cx="80" cy="-60" r="8" fill="#ffd43b"/>
    <text x="95" y="-55" fill="#ffd43b" font-size="11">(screenX, screenY)</text>
  </g>
  
  <!-- Formula box -->
  <g transform="translate(400, 420)">
    <rect x="-200" y="-35" width="400" height="70" fill="#2d3436" stroke="#74b9ff" stroke-width="2" rx="8"/>
    <text x="0" y="-10" text-anchor="middle" fill="#74b9ff" font-size="14" font-weight="bold">ISOMETRIC FORMULAS</text>
    <text x="0" y="15" text-anchor="middle" fill="white" font-size="13" font-family="monospace">screenX = (x - y) × cos(30°) = (x - y) × 0.866</text>
    <text x="0" y="35" text-anchor="middle" fill="white" font-size="13" font-family="monospace">screenY = (x + y) × sin(30°) - z = (x + y) × 0.5 - z</text>
  </g>
  
  <!-- Key insight callout -->
  <g transform="translate(700, 120)">
    <rect x="-80" y="-40" width="160" height="80" fill="#1e3a5f" stroke="#339af0" stroke-width="2" rx="8"/>
    <text x="0" y="-15" text-anchor="middle" fill="white" font-size="11" font-weight="bold">KEY INSIGHT</text>
    <text x="0" y="5" text-anchor="middle" fill="#aaa" font-size="10">30° angle creates</text>
    <text x="0" y="20" text-anchor="middle" fill="#aaa" font-size="10">the classic "diamond"</text>
    <text x="0" y="35" text-anchor="middle" fill="#aaa" font-size="10">tile appearance</text>
  </g>
</svg>
