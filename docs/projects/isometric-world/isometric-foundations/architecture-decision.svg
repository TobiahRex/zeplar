<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee0979"/>
      <stop offset="100%" style="stop-color:#ff6a00"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="white" font-size="22" font-weight="bold">Isometric Rendering Approaches in React</text>
  <text x="450" y="65" text-anchor="middle" fill="#8b949e" font-size="14">Choosing the right tool for your use case</text>
  
  <!-- Approach 1: CSS/SVG -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="200" height="200" rx="12" fill="url(#grad1)" opacity="0.9"/>
    <text x="100" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="bold">CSS + SVG</text>
    <text x="100" y="55" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">transform: rotateX(60deg)</text>
    
    <line x1="20" y1="75" x2="180" y2="75" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <text x="25" y="100" fill="white" font-size="12">✓ Simple to implement</text>
    <text x="25" y="120" fill="white" font-size="12">✓ React-native events</text>
    <text x="25" y="140" fill="white" font-size="12">✗ Limited to ~100 tiles</text>
    <text x="25" y="160" fill="white" font-size="12">✗ No true 3D depth</text>
    
    <rect x="20" y="175" width="160" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="189" text-anchor="middle" fill="white" font-size="11">Best for: Simple demos</text>
  </g>
  
  <!-- Approach 2: Canvas 2D -->
  <g transform="translate(350, 130)">
    <rect x="0" y="0" width="200" height="200" rx="12" fill="url(#grad2)" opacity="0.9"/>
    <text x="100" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Canvas 2D</text>
    <text x="100" y="55" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">Manual isometric math</text>
    
    <line x1="20" y1="75" x2="180" y2="75" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <text x="25" y="100" fill="white" font-size="12">✓ Good performance</text>
    <text x="25" y="120" fill="white" font-size="12">✓ No dependencies</text>
    <text x="25" y="140" fill="white" font-size="12">✗ Manual hit detection</text>
    <text x="25" y="160" fill="white" font-size="12">✗ Complex z-sorting</text>
    
    <rect x="20" y="175" width="160" height="20" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="100" y="189" text-anchor="middle" fill="white" font-size="11">Best for: 2D games</text>
  </g>
  
  <!-- Approach 3: Three.js / R3F -->
  <g transform="translate(600, 130)">
    <rect x="0" y="0" width="200" height="200" rx="12" fill="url(#grad3)" opacity="0.9"/>
    <rect x="0" y="0" width="200" height="200" rx="12" stroke="#ffd700" stroke-width="3" fill="none"/>
    <text x="100" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="bold">React Three Fiber</text>
    <text x="100" y="55" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">OrthographicCamera + 3D</text>
    
    <line x1="20" y1="75" x2="180" y2="75" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    
    <text x="25" y="100" fill="white" font-size="12">✓ True 3D + auto z-sort</text>
    <text x="25" y="120" fill="white" font-size="12">✓ Built-in raycasting</text>
    <text x="25" y="140" fill="white" font-size="12">✓ 1000+ objects easy</text>
    <text x="25" y="160" fill="white" font-size="12">✓ GPU instancing</text>
    
    <rect x="20" y="175" width="160" height="20" rx="4" fill="rgba(255,200,0,0.3)"/>
    <text x="100" y="189" text-anchor="middle" fill="#ffd700" font-size="11" font-weight="bold">★ RECOMMENDED ★</text>
  </g>
  
  <!-- Decision flow -->
  <g transform="translate(100, 380)">
    <text x="350" y="0" text-anchor="middle" fill="white" font-size="18" font-weight="bold">Decision Flow</text>
    
    <!-- Flow nodes -->
    <rect x="280" y="20" width="140" height="40" rx="8" fill="#238636" stroke="#3fb950" stroke-width="2"/>
    <text x="350" y="45" text-anchor="middle" fill="white" font-size="12">1000+ tiles?</text>
    
    <!-- Yes path -->
    <line x1="350" y1="60" x2="350" y2="90" stroke="#3fb950" stroke-width="2"/>
    <text x="365" y="80" fill="#3fb950" font-size="11">YES</text>
    
    <rect x="280" y="90" width="140" height="40" rx="8" fill="#1f6feb"/>
    <text x="350" y="115" text-anchor="middle" fill="white" font-size="12">Interactive?</text>
    
    <!-- Yes path to R3F -->
    <line x1="350" y1="130" x2="350" y2="160" stroke="#58a6ff" stroke-width="2"/>
    <text x="365" y="150" fill="#58a6ff" font-size="11">YES</text>
    
    <rect x="260" y="160" width="180" height="35" rx="8" fill="#ff6a00"/>
    <text x="350" y="183" text-anchor="middle" fill="white" font-size="13" font-weight="bold">→ React Three Fiber</text>
    
    <!-- No path -->
    <line x1="420" y1="40" x2="520" y2="40" stroke="#f85149" stroke-width="2"/>
    <text x="470" y="35" fill="#f85149" font-size="11">NO</text>
    
    <rect x="520" y="20" width="140" height="40" rx="8" fill="#21262d" stroke="#8b949e"/>
    <text x="590" y="45" text-anchor="middle" fill="white" font-size="12">CSS/SVG OK</text>
  </g>
  
  <!-- Your requirements box -->
  <g transform="translate(50, 470)">
    <rect x="0" y="0" width="800" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="25" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">YOUR REQUIREMENTS</text>
    
    <g transform="translate(50, 45)">
      <circle cx="0" cy="10" r="6" fill="#3fb950"/>
      <text x="15" y="15" fill="white" font-size="12">1000 grid cells</text>
    </g>
    <g transform="translate(200, 45)">
      <circle cx="0" cy="10" r="6" fill="#3fb950"/>
      <text x="15" y="15" fill="white" font-size="12">Clickable blocks</text>
    </g>
    <g transform="translate(380, 45)">
      <circle cx="0" cy="10" r="6" fill="#3fb950"/>
      <text x="15" y="15" fill="white" font-size="12">Hover states</text>
    </g>
    <g transform="translate(540, 45)">
      <circle cx="0" cy="10" r="6" fill="#3fb950"/>
      <text x="15" y="15" fill="white" font-size="12">Isometric view</text>
    </g>
    
    <text x="400" y="80" text-anchor="middle" fill="#ffd700" font-size="13" font-weight="bold">→ React Three Fiber with OrthographicCamera is the clear winner</text>
  </g>
</svg>
