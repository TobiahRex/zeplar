<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #canvas {
            display: block;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 35, 45, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            color: white;
            min-width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #info-panel h2 {
            margin-bottom: 8px;
            font-size: 20px;
            color: #58a6ff;
        }

        #info-panel .subtitle {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 16px;
        }

        #info-panel .controls {
            font-size: 12px;
            color: #8b949e;
            line-height: 1.8;
        }

        #info-panel .controls span {
            color: #c9d1d9;
        }

        #state-display {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #state-display p {
            font-size: 12px;
            margin: 4px 0;
        }

        #state-display .label {
            color: #8b949e;
        }

        #hovered-value {
            color: #06b6d4;
            font-weight: 500;
        }

        #selected-value {
            color: #fbbf24;
            font-weight: 500;
        }

        #tile-value {
            color: #a78bfa;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div id="info-panel">
        <h2>🎮 Isometric World</h2>
        <p class="subtitle">32×32 = 1024 tiles + 25 blocks</p>
        <div class="controls">
            🖱️ <span>Left-drag</span> to rotate<br>
            🔍 <span>Scroll</span> to zoom<br>
            👆 <span>Click</span> blocks to select<br>
            ✋ <span>Hover</span> tiles & blocks
        </div>
        <div id="state-display">
            <p><span class="label">Hovered Block:</span> <span id="hovered-value">none</span></p>
            <p><span class="label">Selected Block:</span> <span id="selected-value">none</span></p>
            <p><span class="label">Hovered Tile:</span> <span id="tile-value">none</span></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==========================================================================
        // CONFIGURATION
        // ==========================================================================
        const GRID_SIZE = 32;
        const TILE_SIZE = 1;
        const TILE_GAP = 0.03;

        // ==========================================================================
        // STATE
        // ==========================================================================
        let hoveredBlock = null;
        let selectedBlock = null;
        let hoveredTile = null;
        const blocks = [];
        const tileObjects = [];

        // ==========================================================================
        // SCENE SETUP
        // ==========================================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        // ORTHOGRAPHIC CAMERA - This creates the isometric look!
        // Position at equal x, y, z creates the classic 45° isometric angle
        const frustumSize = 25;
        const aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.OrthographicCamera(
            -frustumSize * aspect, frustumSize * aspect,
            frustumSize, -frustumSize,
            0.1, 1000
        );
        camera.position.set(30, 30, 30);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        renderer.domElement.id = 'canvas';

        // Raycaster for mouse interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // ==========================================================================
        // LIGHTING
        // ==========================================================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(20, 40, 20);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x88ccff, 0.3);
        fillLight.position.set(-10, 10, -10);
        scene.add(fillLight);

        // ==========================================================================
        // CREATE GRID FLOOR (Chessboard pattern)
        // ==========================================================================
        function createGrid() {
            const tileGeometry = new THREE.BoxGeometry(TILE_SIZE, 0.1, TILE_SIZE);
            const lightMaterial = new THREE.MeshStandardMaterial({ color: 0x3d5a80 });
            const darkMaterial = new THREE.MeshStandardMaterial({ color: 0x293241 });
            const hoverMaterial = new THREE.MeshStandardMaterial({ color: 0x98c1d9 });

            const gridGroup = new THREE.Group();

            for (let x = 0; x < GRID_SIZE; x++) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    const isLight = (x + z) % 2 === 0;
                    const material = isLight ? lightMaterial.clone() : darkMaterial.clone();
                    const tile = new THREE.Mesh(tileGeometry, material);

                    tile.position.set(
                        (x - GRID_SIZE / 2) * (TILE_SIZE + TILE_GAP),
                        0,
                        (z - GRID_SIZE / 2) * (TILE_SIZE + TILE_GAP)
                    );
                    tile.receiveShadow = true;

                    // Store metadata for interaction
                    tile.userData = {
                        type: 'tile',
                        id: `tile-${x}-${z}`,
                        gridX: x,
                        gridZ: z,
                        baseColor: isLight ? 0x3d5a80 : 0x293241,
                        hoverColor: 0x98c1d9
                    };

                    gridGroup.add(tile);
                    tileObjects.push(tile);
                }
            }

            scene.add(gridGroup);
        }

        // ==========================================================================
        // CREATE BLOCKS
        // ==========================================================================
        function createBlocks() {
            const blockGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const colors = [0xe63946, 0x2a9d8f, 0xe9c46a, 0x264653, 0xf4a261, 0xa855f7, 0x06b6d4];

            // Random scattered blocks
            for (let i = 0; i < 25; i++) {
                const x = (Math.random() - 0.5) * 24;
                const z = (Math.random() - 0.5) * 24;
                const color = colors[i % colors.length];

                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: 0.2,
                    roughness: 0.5
                });
                const block = new THREE.Mesh(blockGeometry, material);

                block.position.set(x, 0.5, z);
                block.castShadow = true;
                block.receiveShadow = true;

                block.userData = {
                    type: 'block',
                    id: `block-${i}`,
                    baseColor: color,
                    hoverColor: 0xff6b6b,
                    selectedColor: 0xffd700,
                    baseY: 0.5,
                    phase: Math.random() * Math.PI * 2 // For floating animation
                };

                scene.add(block);
                blocks.push(block);
            }

            // Stacked tower
            const towerColors = [0xe63946, 0x2a9d8f, 0xe9c46a, 0x8b5cf6, 0x06b6d4];
            for (let i = 0; i < 5; i++) {
                const material = new THREE.MeshStandardMaterial({
                    color: towerColors[i],
                    metalness: 0.3,
                    roughness: 0.4
                });
                const block = new THREE.Mesh(blockGeometry, material);

                block.position.set(8, 0.5 + i * 0.85, 8);
                block.castShadow = true;
                block.receiveShadow = true;

                block.userData = {
                    type: 'block',
                    id: `tower-${i}`,
                    baseColor: towerColors[i],
                    hoverColor: 0xff6b6b,
                    selectedColor: 0xffd700,
                    baseY: 0.5 + i * 0.85,
                    phase: i * 0.5
                };

                scene.add(block);
                blocks.push(block);
            }
        }

        // ==========================================================================
        // CAMERA CONTROLS (Simple orbit)
        // ==========================================================================
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let spherical = { theta: Math.PI / 4, phi: Math.PI / 4, radius: 52 };

        function updateCamera() {
            camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
            camera.position.y = spherical.radius * Math.cos(spherical.phi);
            camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
            camera.lookAt(0, 0, 0);
        }

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                spherical.theta -= deltaX * 0.01;
                spherical.phi = Math.max(0.3, Math.min(Math.PI / 2.2, spherical.phi + deltaY * 0.01));

                updateCamera();
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mouseup', () => { isDragging = false; });
        renderer.domElement.addEventListener('mouseleave', () => { isDragging = false; });

        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            spherical.radius = Math.max(20, Math.min(80, spherical.radius + e.deltaY * 0.05));
            updateCamera();
        }, { passive: false });

        // ==========================================================================
        // MOUSE INTERACTION (Raycasting)
        // ==========================================================================
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check blocks first (they're on top)
            const blockIntersects = raycaster.intersectObjects(blocks);

            // Reset previous hovered block
            if (hoveredBlock && hoveredBlock !== selectedBlock) {
                hoveredBlock.material.color.setHex(hoveredBlock.userData.baseColor);
                hoveredBlock.scale.set(1, 1, 1);
            }

            if (blockIntersects.length > 0) {
                const block = blockIntersects[0].object;
                if (block !== selectedBlock) {
                    block.material.color.setHex(block.userData.hoverColor);
                }
                block.scale.set(1.1, 1.1, 1.1);
                hoveredBlock = block;
                document.getElementById('hovered-value').textContent = block.userData.id;

                // Reset tile hover when over block
                if (hoveredTile) {
                    hoveredTile.material.color.setHex(hoveredTile.userData.baseColor);
                    hoveredTile = null;
                    document.getElementById('tile-value').textContent = 'none';
                }
            } else {
                hoveredBlock = null;
                document.getElementById('hovered-value').textContent = 'none';

                // Check tiles
                const tileIntersects = raycaster.intersectObjects(tileObjects);

                if (hoveredTile) {
                    hoveredTile.material.color.setHex(hoveredTile.userData.baseColor);
                }

                if (tileIntersects.length > 0) {
                    const tile = tileIntersects[0].object;
                    tile.material.color.setHex(tile.userData.hoverColor);
                    hoveredTile = tile;
                    document.getElementById('tile-value').textContent = tile.userData.id;
                } else {
                    hoveredTile = null;
                    document.getElementById('tile-value').textContent = 'none';
                }
            }
        }

        function onClick(event) {
            if (isDragging) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(blocks);

            // Reset previous selection
            if (selectedBlock) {
                selectedBlock.material.color.setHex(selectedBlock.userData.baseColor);
            }

            if (intersects.length > 0) {
                const block = intersects[0].object;
                if (selectedBlock === block) {
                    selectedBlock = null;
                    document.getElementById('selected-value').textContent = 'none';
                } else {
                    selectedBlock = block;
                    block.material.color.setHex(block.userData.selectedColor);
                    document.getElementById('selected-value').textContent = block.userData.id;
                }
            } else {
                selectedBlock = null;
                document.getElementById('selected-value').textContent = 'none';
            }
        }

        renderer.domElement.addEventListener('mousemove', onMouseMove);
        renderer.domElement.addEventListener('click', onClick);

        // ==========================================================================
        // ANIMATION LOOP
        // ==========================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // Floating animation for blocks
            blocks.forEach(block => {
                const floatOffset = Math.sin(elapsed * 1.5 + block.userData.phase) * 0.08;
                block.position.y = block.userData.baseY + floatOffset;
            });

            renderer.render(scene, camera);
        }

        // ==========================================================================
        // WINDOW RESIZE
        // ==========================================================================
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect;
            camera.right = frustumSize * aspect;
            camera.top = frustumSize;
            camera.bottom = -frustumSize;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================================================
        // INITIALIZE
        // ==========================================================================
        createGrid();
        createBlocks();
        updateCamera();
        animate();

        console.log('🎮 Isometric World loaded!');
        console.log(`📊 ${GRID_SIZE * GRID_SIZE} tiles + ${blocks.length} blocks`);
    </script>
</body>

</html>
