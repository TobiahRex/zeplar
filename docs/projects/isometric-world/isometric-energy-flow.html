<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isometric World - Energy Flow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0d1117; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #canvas { display: block; }
    
    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(13, 17, 23, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      color: white;
      min-width: 240px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    #info-panel h2 { 
      margin-bottom: 4px; 
      font-size: 20px;
      background: linear-gradient(90deg, #06b6d4, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #info-panel .subtitle {
      color: #8b949e;
      font-size: 12px;
      margin-bottom: 16px;
    }
    #info-panel .controls {
      font-size: 12px;
      color: #8b949e;
      line-height: 2;
    }
    #info-panel .controls span { color: #c9d1d9; }
    
    .effect-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      margin-left: 8px;
    }
    .badge-flow { background: rgba(6, 182, 212, 0.2); color: #06b6d4; }
    .badge-burst { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
    
    #state-display {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #state-display p {
      font-size: 11px;
      margin: 4px 0;
    }
    #state-display .label { color: #8b949e; }
    #hovered-value { color: #06b6d4; font-weight: 500; }
    #selected-value { color: #fbbf24; font-weight: 500; }
    #connections-value { color: #a855f7; font-weight: 500; }
    
    #legend {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #legend h3 {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin: 6px 0;
      font-size: 11px;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div id="info-panel">
    <h2>⚡ Energy Network</h2>
    <p class="subtitle">Connected blocks sharing energy flows</p>
    <div class="controls">
      🖱️ <span>Drag</span> to orbit<br>
      🔍 <span>Scroll</span> to zoom<br>
      👆 <span>Click block</span> to select <span class="effect-badge badge-burst">+ BURST</span><br>
      ⚡ <span>Paths</span> show energy flow <span class="effect-badge badge-flow">ANIMATED</span>
    </div>
    <div id="state-display">
      <p><span class="label">Hovered:</span> <span id="hovered-value">none</span></p>
      <p><span class="label">Selected:</span> <span id="selected-value">none</span></p>
      <p><span class="label">Connections:</span> <span id="connections-value">0</span></p>
    </div>
    <div id="legend">
      <h3>Energy Types</h3>
      <div class="legend-item">
        <div class="legend-color" style="background: linear-gradient(90deg, #06b6d4, #22d3ee);"></div>
        <span>Cyan - Data Flow</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: linear-gradient(90deg, #a855f7, #c084fc);"></div>
        <span>Purple - Power Flow</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: linear-gradient(90deg, #22c55e, #4ade80);"></div>
        <span>Green - Sync Flow</span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ==========================================================================
    // CONFIGURATION
    // ==========================================================================
    const GRID_SIZE = 32;
    const TILE_SIZE = 1;
    const TILE_GAP = 0.03;
    
    // ==========================================================================
    // STATE
    // ==========================================================================
    let hoveredBlock = null;
    let selectedBlock = null;
    let hoveredTile = null;
    const blocks = [];
    const tileObjects = [];
    const energyPaths = [];
    const burstEffects = [];
    
    // ==========================================================================
    // SCENE SETUP
    // ==========================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e14);
    
    // Add fog for atmosphere
    scene.fog = new THREE.FogExp2(0x0a0e14, 0.012);
    
    const frustumSize = 25;
    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(
      -frustumSize * aspect, frustumSize * aspect,
      frustumSize, -frustumSize,
      0.1, 1000
    );
    camera.position.set(30, 30, 30);
    camera.lookAt(0, 0, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    renderer.domElement.id = 'canvas';
    
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    
    // ==========================================================================
    // LIGHTING
    // ==========================================================================
    const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(20, 40, 20);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    directionalLight.shadow.camera.near = 0.5;
    directionalLight.shadow.camera.far = 100;
    directionalLight.shadow.camera.left = -30;
    directionalLight.shadow.camera.right = 30;
    directionalLight.shadow.camera.top = 30;
    directionalLight.shadow.camera.bottom = -30;
    scene.add(directionalLight);
    
    // Colored rim lights for atmosphere
    const cyanLight = new THREE.PointLight(0x06b6d4, 0.5, 50);
    cyanLight.position.set(-15, 10, 15);
    scene.add(cyanLight);
    
    const purpleLight = new THREE.PointLight(0xa855f7, 0.5, 50);
    purpleLight.position.set(15, 10, -15);
    scene.add(purpleLight);
    
    // ==========================================================================
    // CREATE GRID FLOOR
    // ==========================================================================
    function createGrid() {
      const tileGeometry = new THREE.BoxGeometry(TILE_SIZE, 0.1, TILE_SIZE);
      
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
          const isLight = (x + z) % 2 === 0;
          const material = new THREE.MeshStandardMaterial({ 
            color: isLight ? 0x1a1f2e : 0x141824,
            metalness: 0.3,
            roughness: 0.8
          });
          const tile = new THREE.Mesh(tileGeometry, material);
          
          tile.position.set(
            (x - GRID_SIZE / 2) * (TILE_SIZE + TILE_GAP),
            0,
            (z - GRID_SIZE / 2) * (TILE_SIZE + TILE_GAP)
          );
          tile.receiveShadow = true;
          
          tile.userData = {
            type: 'tile',
            id: `tile-${x}-${z}`,
            gridX: x,
            gridZ: z,
            baseColor: isLight ? 0x1a1f2e : 0x141824,
            hoverColor: 0x2d3548
          };
          
          scene.add(tile);
          tileObjects.push(tile);
        }
      }
    }
    
    // ==========================================================================
    // CREATE BLOCKS WITH GLOW
    // ==========================================================================
    function createBlocks() {
      const blockGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
      const colors = [
        { base: 0x06b6d4, emissive: 0x06b6d4 }, // Cyan
        { base: 0xa855f7, emissive: 0xa855f7 }, // Purple
        { base: 0x22c55e, emissive: 0x22c55e }, // Green
        { base: 0xf59e0b, emissive: 0xf59e0b }, // Amber
        { base: 0xef4444, emissive: 0xef4444 }, // Red
      ];
      
      // Create blocks in a more structured pattern for better connections
      const positions = [
        // Central cluster
        { x: 0, z: 0 },
        { x: 2, z: 1 },
        { x: -1, z: 2 },
        { x: 1, z: -2 },
        { x: -2, z: -1 },
        // Outer ring
        { x: 5, z: 3 },
        { x: 6, z: -2 },
        { x: -4, z: 5 },
        { x: -5, z: -3 },
        { x: 3, z: -5 },
        // Far nodes
        { x: 9, z: 1 },
        { x: -8, z: -6 },
        { x: -7, z: 7 },
        { x: 8, z: -7 },
        { x: -3, z: -8 },
      ];
      
      positions.forEach((pos, i) => {
        const colorSet = colors[i % colors.length];
        
        const material = new THREE.MeshStandardMaterial({ 
          color: colorSet.base,
          emissive: colorSet.emissive,
          emissiveIntensity: 0.2,
          metalness: 0.4,
          roughness: 0.3
        });
        const block = new THREE.Mesh(blockGeometry, material);
        
        block.position.set(pos.x, 0.5, pos.z);
        block.castShadow = true;
        block.receiveShadow = true;
        
        block.userData = {
          type: 'block',
          id: `node-${i}`,
          index: i,
          baseColor: colorSet.base,
          emissiveColor: colorSet.emissive,
          hoverColor: 0xffffff,
          selectedColor: 0xffd700,
          baseY: 0.5,
          phase: Math.random() * Math.PI * 2,
          connections: []
        };
        
        scene.add(block);
        blocks.push(block);
      });
    }
    
    // ==========================================================================
    // ENERGY PATH SYSTEM
    // ==========================================================================
    function createEnergyPath(startBlock, endBlock, colorHex, flowSpeed = 1) {
      const start = startBlock.position.clone();
      const end = endBlock.position.clone();
      
      // Lift the path above the ground
      start.y = 0.6;
      end.y = 0.6;
      
      // Create a curved path with control points
      const mid = new THREE.Vector3().lerpVectors(start, end, 0.5);
      mid.y += 1.5 + Math.random() * 0.5; // Arc height
      
      // Slight offset to prevent overlapping
      const perpendicular = new THREE.Vector3()
        .subVectors(end, start)
        .cross(new THREE.Vector3(0, 1, 0))
        .normalize()
        .multiplyScalar((Math.random() - 0.5) * 0.5);
      mid.add(perpendicular);
      
      const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
      
      // Create tube geometry for the path
      const tubeGeometry = new THREE.TubeGeometry(curve, 32, 0.05, 8, false);
      
      // Create gradient texture for flowing effect
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 1;
      const ctx = canvas.getContext('2d');
      
      // Create repeating gradient pattern
      const gradient = ctx.createLinearGradient(0, 0, 256, 0);
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(0.3, `#${colorHex.toString(16).padStart(6, '0')}`);
      gradient.addColorStop(0.5, '#ffffff');
      gradient.addColorStop(0.7, `#${colorHex.toString(16).padStart(6, '0')}`);
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 256, 1);
      
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.repeat.x = 3;
      
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide
      });
      
      const tube = new THREE.Mesh(tubeGeometry, material);
      scene.add(tube);
      
      // Store for animation
      const pathData = {
        mesh: tube,
        texture: texture,
        speed: flowSpeed * (0.8 + Math.random() * 0.4),
        offset: Math.random(),
        startBlock: startBlock,
        endBlock: endBlock,
        color: colorHex
      };
      
      energyPaths.push(pathData);
      
      // Track connections
      startBlock.userData.connections.push(endBlock.userData.id);
      endBlock.userData.connections.push(startBlock.userData.id);
      
      return pathData;
    }
    
    // Create connections between nearby blocks
    function createEnergyNetwork() {
      const pathColors = [0x06b6d4, 0xa855f7, 0x22c55e];
      let connectionCount = 0;
      
      // Connect blocks that are within range
      for (let i = 0; i < blocks.length; i++) {
        for (let j = i + 1; j < blocks.length; j++) {
          const dist = blocks[i].position.distanceTo(blocks[j].position);
          
          // Connect if within range (creates a nice network)
          if (dist < 6) {
            const color = pathColors[connectionCount % pathColors.length];
            createEnergyPath(blocks[i], blocks[j], color, 0.5 + Math.random() * 0.5);
            connectionCount++;
          }
        }
      }
      
      document.getElementById('connections-value').textContent = connectionCount;
    }
    
    // ==========================================================================
    // BURST EFFECT SYSTEM
    // ==========================================================================
    function createBurstEffect(position, color = 0xffd700) {
      const burstGroup = new THREE.Group();
      burstGroup.position.copy(position);
      
      // Create multiple expanding rings
      const ringCount = 3;
      const rings = [];
      
      for (let i = 0; i < ringCount; i++) {
        // Ring geometry (torus for a ring shape)
        const ringGeometry = new THREE.TorusGeometry(0.1, 0.03, 8, 32);
        const ringMaterial = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: 0.8,
          side: THREE.DoubleSide
        });
        
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = Math.PI / 2; // Lay flat
        ring.scale.set(0.1, 0.1, 0.1);
        
        rings.push({
          mesh: ring,
          delay: i * 0.1, // Stagger the rings
          maxScale: 3 + i * 0.5
        });
        
        burstGroup.add(ring);
      }
      
      // Add a central flash sphere
      const flashGeometry = new THREE.SphereGeometry(0.3, 16, 16);
      const flashMaterial = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 1
      });
      const flash = new THREE.Mesh(flashGeometry, flashMaterial);
      burstGroup.add(flash);
      
      // Add dome/hemisphere
      const domeGeometry = new THREE.SphereGeometry(0.5, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const domeMaterial = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.4,
        side: THREE.DoubleSide
      });
      const dome = new THREE.Mesh(domeGeometry, domeMaterial);
      dome.rotation.x = -Math.PI; // Flip to dome up
      burstGroup.add(dome);
      
      // Add particles
      const particleCount = 20;
      const particlesGeometry = new THREE.BufferGeometry();
      const particlePositions = new Float32Array(particleCount * 3);
      const particleVelocities = [];
      
      for (let i = 0; i < particleCount; i++) {
        particlePositions[i * 3] = 0;
        particlePositions[i * 3 + 1] = 0;
        particlePositions[i * 3 + 2] = 0;
        
        // Random outward velocity
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI * 0.5;
        particleVelocities.push({
          x: Math.sin(phi) * Math.cos(theta) * (2 + Math.random() * 2),
          y: Math.cos(phi) * (1 + Math.random() * 2),
          z: Math.sin(phi) * Math.sin(theta) * (2 + Math.random() * 2)
        });
      }
      
      particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
      
      const particlesMaterial = new THREE.PointsMaterial({
        color: color,
        size: 0.15,
        transparent: true,
        opacity: 1
      });
      
      const particles = new THREE.Points(particlesGeometry, particlesMaterial);
      burstGroup.add(particles);
      
      scene.add(burstGroup);
      
      // Store burst data for animation
      burstEffects.push({
        group: burstGroup,
        rings: rings,
        flash: flash,
        dome: dome,
        particles: particles,
        particleVelocities: particleVelocities,
        age: 0,
        duration: 1.2,
        color: color
      });
    }
    
    // Update burst effects
    function updateBursts(deltaTime) {
      for (let i = burstEffects.length - 1; i >= 0; i--) {
        const burst = burstEffects[i];
        burst.age += deltaTime;
        
        const progress = burst.age / burst.duration;
        
        if (progress >= 1) {
          // Remove completed burst
          scene.remove(burst.group);
          burstEffects.splice(i, 1);
          continue;
        }
        
        // Animate rings
        burst.rings.forEach((ring, index) => {
          const ringProgress = Math.max(0, (burst.age - ring.delay) / (burst.duration - ring.delay));
          if (ringProgress > 0) {
            // Ease out expansion
            const easeOut = 1 - Math.pow(1 - ringProgress, 3);
            const scale = ring.maxScale * easeOut;
            ring.mesh.scale.set(scale, scale, scale * 0.3);
            ring.mesh.material.opacity = 0.8 * (1 - ringProgress);
          }
        });
        
        // Animate flash (quick fade)
        const flashProgress = Math.min(1, burst.age / 0.15);
        burst.flash.material.opacity = 1 - flashProgress;
        burst.flash.scale.setScalar(1 + flashProgress * 0.5);
        
        // Animate dome
        const domeEase = 1 - Math.pow(1 - progress, 2);
        const domeScale = 4 * domeEase;
        burst.dome.scale.set(domeScale, domeScale * 0.6, domeScale);
        burst.dome.material.opacity = 0.4 * (1 - progress);
        
        // Animate particles
        const positions = burst.particles.geometry.attributes.position.array;
        for (let j = 0; j < burst.particleVelocities.length; j++) {
          const vel = burst.particleVelocities[j];
          positions[j * 3] += vel.x * deltaTime;
          positions[j * 3 + 1] += vel.y * deltaTime;
          positions[j * 3 + 2] += vel.z * deltaTime;
          
          // Gravity
          vel.y -= 5 * deltaTime;
        }
        burst.particles.geometry.attributes.position.needsUpdate = true;
        burst.particles.material.opacity = 1 - progress;
      }
    }
    
    // ==========================================================================
    // CAMERA CONTROLS
    // ==========================================================================
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let spherical = { theta: Math.PI / 4, phi: Math.PI / 4, radius: 52 };
    
    function updateCamera() {
      camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
      camera.position.y = spherical.radius * Math.cos(spherical.phi);
      camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
      camera.lookAt(0, 0, 0);
    }
    
    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      }
    });
    
    renderer.domElement.addEventListener('mousemove', (e) => {
      // Update mouse for raycasting
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      if (isDragging) {
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;
        
        spherical.theta -= deltaX * 0.01;
        spherical.phi = Math.max(0.3, Math.min(Math.PI / 2.2, spherical.phi + deltaY * 0.01));
        
        updateCamera();
        previousMousePosition = { x: e.clientX, y: e.clientY };
      } else {
        // Hover detection
        handleHover();
      }
    });
    
    renderer.domElement.addEventListener('mouseup', () => { isDragging = false; });
    renderer.domElement.addEventListener('mouseleave', () => { isDragging = false; });
    
    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      spherical.radius = Math.max(20, Math.min(80, spherical.radius + e.deltaY * 0.05));
      updateCamera();
    }, { passive: false });
    
    // ==========================================================================
    // HOVER & CLICK HANDLING
    // ==========================================================================
    function handleHover() {
      raycaster.setFromCamera(mouse, camera);
      
      const blockIntersects = raycaster.intersectObjects(blocks);
      
      // Reset previous hovered block
      if (hoveredBlock && hoveredBlock !== selectedBlock) {
        hoveredBlock.material.emissiveIntensity = 0.2;
        hoveredBlock.scale.set(1, 1, 1);
      }
      
      if (blockIntersects.length > 0) {
        const block = blockIntersects[0].object;
        if (block !== selectedBlock) {
          block.material.emissiveIntensity = 0.6;
        }
        block.scale.set(1.1, 1.1, 1.1);
        hoveredBlock = block;
        document.getElementById('hovered-value').textContent = block.userData.id;
        
        if (hoveredTile) {
          hoveredTile.material.color.setHex(hoveredTile.userData.baseColor);
          hoveredTile = null;
        }
      } else {
        hoveredBlock = null;
        document.getElementById('hovered-value').textContent = 'none';
        
        const tileIntersects = raycaster.intersectObjects(tileObjects);
        
        if (hoveredTile) {
          hoveredTile.material.color.setHex(hoveredTile.userData.baseColor);
        }
        
        if (tileIntersects.length > 0) {
          const tile = tileIntersects[0].object;
          tile.material.color.setHex(tile.userData.hoverColor);
          hoveredTile = tile;
        } else {
          hoveredTile = null;
        }
      }
    }
    
    renderer.domElement.addEventListener('click', (e) => {
      if (isDragging) return;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(blocks);
      
      if (selectedBlock) {
        selectedBlock.material.emissiveIntensity = 0.2;
        selectedBlock.material.color.setHex(selectedBlock.userData.baseColor);
      }
      
      if (intersects.length > 0) {
        const block = intersects[0].object;
        
        // Create burst effect at click location!
        const burstPosition = block.position.clone();
        burstPosition.y = 0.5;
        createBurstEffect(burstPosition, block.userData.emissiveColor);
        
        if (selectedBlock === block) {
          selectedBlock = null;
          document.getElementById('selected-value').textContent = 'none';
        } else {
          selectedBlock = block;
          block.material.emissiveIntensity = 0.8;
          block.material.color.setHex(block.userData.selectedColor);
          document.getElementById('selected-value').textContent = block.userData.id;
        }
      } else {
        selectedBlock = null;
        document.getElementById('selected-value').textContent = 'none';
      }
    });
    
    // ==========================================================================
    // ANIMATION LOOP
    // ==========================================================================
    const clock = new THREE.Clock();
    let lastTime = 0;
    
    function animate() {
      requestAnimationFrame(animate);
      
      const elapsed = clock.getElapsedTime();
      const deltaTime = elapsed - lastTime;
      lastTime = elapsed;
      
      // Animate blocks (floating + pulse)
      blocks.forEach(block => {
        const floatOffset = Math.sin(elapsed * 1.5 + block.userData.phase) * 0.08;
        block.position.y = block.userData.baseY + floatOffset;
        
        // Subtle emissive pulse
        if (block !== selectedBlock) {
          const pulse = 0.15 + Math.sin(elapsed * 2 + block.userData.phase) * 0.05;
          block.material.emissiveIntensity = block === hoveredBlock ? 0.6 : pulse;
        }
      });
      
      // Animate energy paths (flowing effect)
      energyPaths.forEach(path => {
        path.offset += path.speed * deltaTime;
        path.texture.offset.x = path.offset;
        
        // Pulse the path opacity slightly
        path.mesh.material.opacity = 0.6 + Math.sin(elapsed * 3 + path.offset) * 0.2;
      });
      
      // Update burst effects
      updateBursts(deltaTime);
      
      // Animate accent lights
      cyanLight.intensity = 0.4 + Math.sin(elapsed * 1.5) * 0.1;
      purpleLight.intensity = 0.4 + Math.sin(elapsed * 1.5 + Math.PI) * 0.1;
      
      renderer.render(scene, camera);
    }
    
    // ==========================================================================
    // WINDOW RESIZE
    // ==========================================================================
    window.addEventListener('resize', () => {
      const aspect = window.innerWidth / window.innerHeight;
      camera.left = -frustumSize * aspect;
      camera.right = frustumSize * aspect;
      camera.top = frustumSize;
      camera.bottom = -frustumSize;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    // ==========================================================================
    // INITIALIZE
    // ==========================================================================
    createGrid();
    createBlocks();
    createEnergyNetwork();
    updateCamera();
    animate();
    
    console.log('⚡ Energy Network loaded!');
    console.log(`📊 ${GRID_SIZE * GRID_SIZE} tiles, ${blocks.length} nodes, ${energyPaths.length} connections`);
  </script>
</body>
</html>
